<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saúde Digital — Painel do Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <div class="app-body">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="conteudo">
        <div class="cabecalho-pagina">
          <div>
            <h1>Painel — <span id="nome-organizacao">...</span></h1>
            <p class="texto-suave">Resumo da sua organização no sistema Saúde Digital.</p>
          </div>
        </div>

        <div class="grade-cartoes">
          <div class="cartao-metrica">
            <span class="rotulo">Profissionais cadastrados</span>
            <span class="valor" id="m-prof">0</span>
          </div>
          <div class="cartao-metrica">
            <span class="rotulo">Pacientes cadastrados</span>
            <span class="valor" id="m-pac">0</span>
          </div>
          <div class="cartao-metrica">
            <span class="rotulo">Consultas registradas</span>
            <span class="valor" id="m-consultas">0</span>
          </div>
        </div>

        <div class="painel-flex">
          <div class="cartao">
            <h2>Profissionais</h2>
            <p class="texto-fraco">Últimos profissionais cadastrados na organização.</p>
            <div class="wrapper-tabela">
              <table>
                <thead><tr><th>Nome</th><th>Especialidade</th><th>Pacientes</th></tr></thead>
                <tbody id="corpo-tabela-profissionais"></tbody>
              </table>
            </div>
            <a class="botao botao-contorno botao-pequeno" href="profissionais.html" style="margin-top:12px">Ver todos</a>
          </div>

          <div class="cartao">
            <h2>Atalhos</h2>
            <div class="grupo-botoes" style="flex-direction:column;align-items:stretch">
              <a class="botao botao-primario" href="profissionais.html">+ Novo profissional</a>
              <a class="botao botao-secundario" href="pacientes.html">+ Novo paciente</a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../js/storage.js"></script>
  <script src="../../js/aplicacao.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
