<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saúde Digital — Minha Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="agenda.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <div class="app-body">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="conteudo">
        <div class="cabecalho-pagina">
          <div>
            <h1>Minha agenda</h1>
            <p class="texto-suave">Solicite um horário disponível com seu profissional e acompanhe suas consultas.</p>
          </div>
        </div>

        <div id="aviso-sem-profissional" class="cartao vazio" hidden>
          <span class="icone-vazio">🗓️</span>
          Você ainda não possui um profissional vinculado. Entre em contato com a administração da sua organização.
        </div>

        <div id="conteudo-agenda-paciente" hidden>
          <div class="painel-flex">
            <div class="cartao">
              <h2>Horários disponíveis</h2>
              <p class="texto-fraco">Com <strong id="nome-profissional-vinculado"></strong></p>
              <div class="wrapper-tabela">
                <table>
                  <thead><tr><th>Data</th><th>Hora</th><th style="width:120px">Ação</th></tr></thead>
                  <tbody id="corpo-horarios-disponiveis"></tbody>
                </table>
              </div>
            </div>

            <div class="cartao">
              <h2>Minhas consultas</h2>
              <div class="wrapper-tabela">
                <table>
                  <thead><tr><th>Data</th><th>Hora</th><th>Status</th><th></th></tr></thead>
                  <tbody id="corpo-minhas-consultas"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="../../js/storage.js"></script>
  <script src="../../js/aplicacao.js"></script>
  <script src="agenda.js"></script>
</body>
</html>
