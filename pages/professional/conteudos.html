<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saúde Digital — Biblioteca de Conteúdos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="conteudos.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <div class="app-body">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="conteudo">
        <div class="cabecalho-pagina">
          <div>
            <h1>Biblioteca de conteúdos</h1>
            <p class="texto-suave">Cursos, livros e documentários que podem ser recomendados aos pacientes.</p>
          </div>
          <button type="button" class="botao botao-primario" id="botao-novo-conteudo">+ Novo conteúdo</button>
        </div>

        <div class="grade-conteudos" id="grade-conteudos"></div>
      </main>
    </div>
  </div>

  <dialog class="modal" id="modal-conteudo">
    <form method="dialog" id="formulario-conteudo">
      <div class="modal-cabecalho">
        <h2 id="titulo-modal-conteudo">Novo conteúdo</h2>
        <button type="button" class="modal-fechar" data-fechar="modal-conteudo" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-corpo">
        <input type="hidden" id="conteudo-id" />
        <div class="campo">
          <label for="conteudo-titulo">Título</label>
          <input type="text" id="conteudo-titulo" required />
        </div>
        <div class="campo">
          <label for="conteudo-tipo">Tipo</label>
          <select id="conteudo-tipo" required>
            <option value="documentario">Documentário</option>
            <option value="curso">Curso</option>
            <option value="livro">Livro</option>
            <option value="artigo">Artigo</option>
          </select>
        </div>
        <div class="campo">
          <label for="conteudo-descricao">Descrição</label>
          <textarea id="conteudo-descricao" required></textarea>
        </div>
        <div class="campo">
          <label for="conteudo-url">Link (opcional)</label>
          <input type="url" id="conteudo-url" placeholder="https://..." />
        </div>
      </div>
      <div class="modal-rodape">
        <button type="button" class="botao botao-fantasma" data-fechar="modal-conteudo">Cancelar</button>
        <button type="submit" class="botao botao-primario">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="../../js/storage.js"></script>
  <script src="../../js/aplicacao.js"></script>
  <script src="conteudos.js"></script>
</body>
</html>
