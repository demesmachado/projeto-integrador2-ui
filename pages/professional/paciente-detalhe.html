<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saúde Digital — Ficha do Paciente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="paciente-detalhe.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <div class="app-body">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="conteudo">
        <a href="pacientes.html" class="link-voltar">← Voltar para pacientes</a>

        <div class="cartao cartao-perfil-paciente" id="cartao-perfil">
          <div class="tabela-vazia">Carregando paciente...</div>
        </div>

        <div class="painel-flex">
          <div>
            <div class="cartao">
              <h2>Histórico de consultas</h2>
              <div id="lista-historico" class="lista-historico"></div>
            </div>

            <div class="cartao">
              <h2>Evolução do paciente</h2>
              <form id="formulario-evolucao">
                <div class="campo">
                  <label for="evolucao-indicador">Indicador geral de bem-estar</label>
                  <select id="evolucao-indicador" required>
                    <option value="Ótimo">Ótimo</option>
                    <option value="Bom">Bom</option>
                    <option value="Regular">Regular</option>
                    <option value="Ruim">Ruim</option>
                  </select>
                </div>
                <div class="campo">
                  <label for="evolucao-texto">Notas de evolução</label>
                  <textarea id="evolucao-texto" placeholder="Descreva a evolução clínica observada..." required></textarea>
                </div>
                <button type="submit" class="botao botao-primario botao-pequeno">Registrar evolução</button>
              </form>
              <hr class="separador" />
              <div id="lista-evolucao" class="lista-evolucao"></div>
            </div>
          </div>

          <div>
            <div class="cartao">
              <h2>Notificações</h2>
              <p class="texto-fraco">Últimas notificações enviadas a este paciente.</p>
              <div id="lista-notificacoes-paciente" class="lista-notificacoes-mini"></div>
              <a class="botao botao-secundario botao-pequeno botao-bloco" id="link-nova-notificacao" href="#" style="margin-top:10px">+ Nova notificação</a>
            </div>

            <div class="cartao">
              <h2>Conteúdos recomendados</h2>
              <div class="campo">
                <label for="seletor-conteudo">Recomendar conteúdo da biblioteca</label>
                <select id="seletor-conteudo"></select>
              </div>
              <button type="button" class="botao botao-secundario botao-pequeno botao-bloco" id="botao-recomendar">+ Recomendar</button>
              <hr class="separador" />
              <div id="lista-recomendacoes"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/storage.js"></script>
  <script src="../../js/aplicacao.js"></script>
  <script src="paciente-detalhe.js"></script>
</body>
</html>
